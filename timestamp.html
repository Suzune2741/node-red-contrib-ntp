<script type="text/javascript">
    RED.nodes.registerType('timestamp', {
        category: 'ntp',
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            server: { value: "ntp.nict.jp", required: true }, 
            timezone: { value: 9, required: true },
            varname: { value: "t1", required: true },
            dataname: {vale:"data",required:true},
            format: { value: "full_compact" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-clock-o",
        label: function () {
            return this.name || "timestamp";
        }
    });
</script>

<script type="text/html" data-template-name="timestamp">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名前</label>
        <input type="text" id="node-input-name" placeholder="名前">
    </div>
    
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-globe"></i> サーバー</label>
        <input type="text" id="node-input-server" placeholder="例: ntp.nict.jp">
    </div>

    <div class="form-row">
        <label for="node-input-timezone"><i class="fa fa-clock-o"></i> タイムゾーン</label>
        <input type="number" id="node-input-timezone" placeholder="例: 9">
    </div>

    <div class="form-row">
        <label for="node-input-varname"><i class="fa fa-font"></i> 変数名</label>
        <input type="text" id="node-input-varname" placeholder="例: t1">
    </div>
        <div class="form-row">
        <label for="node-input-varname"><i class="fa fa-font"></i> 親ノードからのデータを格納する変数</label>
        <input type="text" id="node-input-dataname" placeholder="例: data">
    </div>

    <div class="form-row">
        <label for="node-input-format"><i class="fa fa-list"></i> フォーマット</label>
        <select id="node-input-format">
            <option value="date_only">日付のみ (YY-MM-DD)</option>
            <option value="time_only">時刻のみ (HH:MM:SS)</option>
            <option value="full_compact">連続文字列 (YYYYMMDDHHMMSS)</option>
        </select>
    </div>
</script>

<script type="text/x-red" data-help-name="timestamp">
    <p>NTPサーバー情報と、マイコン上で日時文字列を作成するためのプログラムコード（sprintf）を生成するノードです。</p>
    <p>選択したフォーマットに合わせて、<code>msg.payload</code> にRubyコードの文字列を出力します。</p>
</script>
